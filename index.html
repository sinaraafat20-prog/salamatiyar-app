<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device=device-width, initial-scale=1.0">
  <title>سلامتیار - کلینیک دکتر رافت</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { vazirmatn: ['Vazirmatn', 'sans-serif'] } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Vazirmatn', sans-serif; direction: rtl; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; margin: 0; color: white; }
    .glass { backdrop-filter: blur(20px); background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
    mark { background: #10b981; color: #000; padding: 0.125em 0.25em; border-radius: 0.25em; font-weight: 600; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const data = {
      clinic: { name: "کلینیک قلب، واریس، لنف و زخم", doctor: "دکتر سینا رافت", phone: "09123456789", map: "https://maps.app.goo.gl/example" },
      topics: [
        { id: "ghalbi", title: "❤️ بیماری‌های قلبی", subtopics: [{ id: "faktor", title: "فاکتورهای خطر", articles: [{ id: "feshar", title: "فشار خون", subs: [{ title: "تعریف", content: "<mark>طبیعی: <120/80</mark> - درمان: کم‌نمک + دارو" }] }] }] },
        { id: "varis", title: "🦵 واریس", subtopics: [{ id: "varis", title: "واریس پا", articles: [{ id: "alamat", title: "علائم", subs: [{ title: "درمان", content: "<mark>لیزر EVLT</mark>" }] }] }] }
      ]
    };
    window.contentData = data;
  </script>
  <script>
    const { useState } = React;
    function App() {
      const [search, setSearch] = useState('');
      const topics = window.contentData.topics.filter(t => t.title.includes(search));
      const handleCall = () => location.href = tel:${window.contentData.clinic.phone};
      return React.createElement('div', { className: 'p-4 min-h-screen' },
        React.createElement('div', { className: 'glass rounded-3xl p-8 mb-8 text-center max-w-4xl mx-auto' },
          React.createElement('h1', { className: 'text-4xl font-bold mb-4' }, window.contentData.clinic.name),
          React.createElement('p', { className: 'text-xl mb-6' }, window.contentData.clinic.doctor),
          React.createElement('button', { onClick: handleCall, className: 'bg-emerald-500 px-8 py-4 rounded-2xl font-bold text-xl mr-4' }, 'تماس'),
          React.createElement('input', { placeholder: 'جستجو...', value: search, onChange: e => setSearch(e.target.value), className: 'mt-4 w-full p-4 bg-white/20 rounded-xl' })
        ),
        ...topics.map(topic => 
          React.createElement('div', { key: topic.id, className: 'glass rounded-3xl p-8 mb-6 max-w-4xl mx-auto cursor-pointer hover:scale-105 transition-all' },
            React.createElement('h2', { className: 'text-3xl font-bold' }, topic.title)
          )
        )
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
